name: Vendored Engine Native Parity

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine name or all"
        required: true
        default: all
      phase:
        description: "Native phase: install, build, or test"
        required: true
        default: test
        type: choice
        options: [install, build, test]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        engine:
          - genoffice
          - openmaic
          - weknora
          - graphiti
          - cognee
          - browser-use
          - open-webui
          - pageindex
          - agent-reach
          - qwen-audio-agent
    steps:
      - name: Select engine
        id: select
        shell: bash
        run: |
          if [[ "${{ inputs.engine }}" == "all" || "${{ inputs.engine }}" == "${{ matrix.engine }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.run == 'true'
        with:
          lfs: true

      - uses: actions/setup-python@v5
        if: steps.select.outputs.run == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.select.outputs.run == 'true'
        with:
          node-version: '22.22.2'

      - uses: actions/setup-go@v5
        if: steps.select.outputs.run == 'true'
        with:
          go-version: '1.24.x'

      - name: Install uv
        if: steps.select.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Verify vendored source before native phase
        if: steps.select.outputs.run == 'true'
        run: |
          python scripts/verify_lock.py
          python scripts/verify_vendored.py --require
          python scripts/verify_engine_contracts.py

      - name: Run selected native phase
        if: steps.select.outputs.run == 'true'
        run: python scripts/engine_tasks.py '${{ inputs.phase }}' --engine '${{ matrix.engine }}' --stop-on-failure
