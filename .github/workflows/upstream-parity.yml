name: Native Vendored Engine Parity Gates
on:
  pull_request:
    branches: [main]
    paths:
      - 'engines/**'
      - 'sources.lock.json'
      - 'vendor.manifest.json'
      - 'upstream-tests.json'
      - 'scripts/engine_tasks.py'
      - 'scripts/verify_vendored.py'
      - '.github/workflows/upstream-parity.yml'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Engine name or all'
        required: true
        default: all

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        engine: [genoffice, openmaic, weknora, graphiti, cognee, browser-use, open-webui, pageindex, agent-reach, qwen-audio-agent]
    steps:
      - name: Skip engines outside requested scope
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine != 'all' && inputs.engine != matrix.engine }}
        run: echo "Skipping ${{ matrix.engine }}"
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          node-version: '22.22.2'
      - uses: actions/setup-go@v5
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          go-version: '1.26.x'
      - name: Enable Corepack
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: corepack enable
      - name: Install uv
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Verify pinned source SHAs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/verify_submodules.py
      - name: Verify committed vendor parity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/verify_vendored.py --compare-sources
      - name: Install vendored engine
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py install --engine '${{ matrix.engine }}' --stop-on-failure
      - name: Build vendored engine
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py build --engine '${{ matrix.engine }}' --stop-on-failure
      - name: Test vendored engine
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py test --engine '${{ matrix.engine }}' --stop-on-failure
