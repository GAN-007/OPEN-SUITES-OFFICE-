name: Upstream Parity Gates
on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'Engine name or all'
        required: true
        default: all

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [genoffice, openmaic, weknora, graphiti, cognee, browser-use, open-webui, pageindex, agent-reach, qwen-audio-agent]
    steps:
      - name: Skip engines outside requested scope
        if: ${{ inputs.engine != 'all' && inputs.engine != matrix.engine }}
        run: echo "Skipping ${{ matrix.engine }}"
      - uses: actions/checkout@v4
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          node-version: '22.22.2'
      - uses: actions/setup-go@v5
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        with:
          go-version: '1.24.x'
      - name: Install uv
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Verify pinned SHA
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/verify_submodules.py
      - name: Install upstream engine
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py install --engine '${{ matrix.engine }}' --stop-on-failure
      - name: Build upstream engine
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py build --engine '${{ matrix.engine }}' --stop-on-failure
      - name: Test upstream engine
        if: ${{ inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python scripts/engine_tasks.py test --engine '${{ matrix.engine }}' --stop-on-failure
