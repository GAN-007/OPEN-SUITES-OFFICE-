name: Nexus CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Verify pinned source lock
        run: python scripts/verify_lock.py
      - name: Verify in-repository engine source integrity
        run: python scripts/verify_vendored.py --require
      - name: Verify engine capability roots
        run: python scripts/verify_engine_contracts.py
      - name: Compile Nexus-owned Python
        run: python -m compileall -q nexus_workspace scripts tests
      - name: Test Nexus control plane
        run: pytest
