name: Nexus CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: python scripts/verify_lock.py
      - run: python -m compileall -q nexus_workspace scripts tests
      - run: pytest
