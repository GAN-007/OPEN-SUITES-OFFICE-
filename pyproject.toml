[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-suites-office-nexus"
version = "0.1.0"
description = "Lossless capability federation for GenOffice, OpenMAIC, WeKnora, Graphiti, Cognee, Browser Use, Open WebUI, PageIndex, Agent-Reach and Qwen Audio Agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GAN-007" }]
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.39,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.20,<1",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1"
]

[project.scripts]
nexus = "nexus_workspace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nexus_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
